name: Lunar OTA image

on:
  push:
    branches: [lunar]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.ref == 'refs/heads/lunar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Verify uploads, publishing, and rollback
        run: go test ./test ./internal/bucket -run 'Test.*(Republish|Rollback|HandleUploadFile|PutBlob)' -count=1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lunar-bedrock/xprem-server:git-${{ github.sha }}
          build-args: VERSION=git-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lunar-bedrock/xprem
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
